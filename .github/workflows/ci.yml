name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduler_test
      DATABASE_SSL: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- server ---
      - name: Install server deps
        working-directory: server
        run: npm install
      - name: Run migrations (fresh DB)
        working-directory: server
        run: npm run migrate
      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit
      - name: Test server
        working-directory: server
        run: npm test

      # --- web ---
      - name: Install web deps
        working-directory: web
        run: npm install
      - name: Typecheck + build web
        working-directory: web
        run: npm run build
