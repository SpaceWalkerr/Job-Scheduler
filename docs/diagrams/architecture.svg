<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="620" fill="#ffffff"/>
  <text x="410" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2430">Distributed Job Scheduler — Architecture</text>

  <!-- Dashboard -->
  <rect x="300" y="70" width="220" height="60" rx="10" fill="#eef3ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="410" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2430">Dashboard</text>
  <text x="410" y="116" text-anchor="middle" font-size="12" fill="#6b7280">React (Vite), polls ~2s</text>

  <!-- arrow dashboard -> api -->
  <line x1="410" y1="130" x2="410" y2="168" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="153" font-size="11" fill="#6b7280">REST + JWT</text>

  <!-- API -->
  <rect x="300" y="170" width="220" height="60" rx="10" fill="#eef3ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="410" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2430">API Server</text>
  <text x="410" y="216" text-anchor="middle" font-size="12" fill="#6b7280">Express (auth, CRUD, jobs)</text>

  <!-- arrow api -> db -->
  <line x1="410" y1="230" x2="410" y2="288" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="422" y="263" font-size="11" fill="#6b7280">SQL</text>

  <!-- Postgres -->
  <rect x="250" y="290" width="320" height="90" rx="10" fill="#e9f7ef" stroke="#3fb950" stroke-width="2"/>
  <text x="410" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">PostgreSQL</text>
  <text x="410" y="342" text-anchor="middle" font-size="12" fill="#4b5563">jobs · queues · job_executions</text>
  <text x="410" y="360" text-anchor="middle" font-size="12" fill="#4b5563">workers · dead_letter_jobs</text>

  <!-- Worker -->
  <rect x="80" y="470" width="250" height="80" rx="10" fill="#fff5e6" stroke="#d29922" stroke-width="2"/>
  <text x="205" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2430">Worker</text>
  <text x="205" y="520" text-anchor="middle" font-size="12" fill="#6b7280">poll loop (1s), executes jobs</text>
  <text x="205" y="537" text-anchor="middle" font-size="12" fill="#6b7280">heartbeats, graceful shutdown</text>

  <!-- Scheduler -->
  <rect x="490" y="470" width="250" height="80" rx="10" fill="#f3ecff" stroke="#a371f7" stroke-width="2"/>
  <text x="615" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2430">Scheduler</text>
  <text x="615" y="520" text-anchor="middle" font-size="12" fill="#6b7280">tick loop (2s): promote due,</text>
  <text x="615" y="537" text-anchor="middle" font-size="12" fill="#6b7280">cron fan-out, reap dead workers</text>

  <!-- worker <-> db -->
  <line x1="250" y1="470" x2="330" y2="382" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="430" font-size="11" fill="#6b7280">claim (SKIP LOCKED)</text>

  <!-- scheduler <-> db -->
  <line x1="570" y1="470" x2="490" y2="382" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="430" font-size="11" fill="#6b7280">promote / reap</text>

  <!-- single process note -->
  <rect x="70" y="455" width="680" height="110" rx="14" fill="none" stroke="#c7ccd6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="410" y="588" text-anchor="middle" font-size="12" fill="#9aa4b2">API + Worker + Scheduler run in one Node process (separable — they only share the database)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
